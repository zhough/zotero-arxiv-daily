name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      backfill_date:
        description: 'One-off missed daily digest'
        type: choice
        options:
          - normal
          - '2026-09-24'
          - '2026-09-25'
        default: normal
  schedule:
    - cron: '47 19 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          if [ "${{ inputs.backfill_date }}" = "2026-09-24" ] || [ "${{ inputs.backfill_date }}" = "2026-09-25" ]; then
            BACKFILL_DATE="${{ inputs.backfill_date }}" uv run replay_backfill.py
          else
            uv run src/zotero_arxiv_daily/main.py
          fi
